[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluator"
version = "0.1.0"
description = "Report-only harness that grades any agent's outputs against a rubric of deterministic checks and an optional LLM judge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
llm = ["anthropic>=2.8"]
dev = ["pytest>=8"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
