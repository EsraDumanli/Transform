[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-identity-spiffe"
version = "0.1.0"
description = "Agent discovery + a lightweight learning SPIFFE server for automated identity assignment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
llm = ["anthropic>=2.8"]
dev = ["pytest>=8"]

[project.scripts]
spiffe-server = "spiffe_identity.server:main"
agent-discovery = "spiffe_identity.cli:main"

[tool.setuptools.packages.find]
include = ["spiffe_identity*"]

[tool.setuptools.package-data]
spiffe_identity = ["portal_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
