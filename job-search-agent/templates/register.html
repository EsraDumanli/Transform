{% extends "base.html" %}
{% block title %}Sign up - Job Search Agent{% endblock %}
{% block content %}
  <h1>Sign up</h1>
  <form method="post" action="{{ url_for('register') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>
      Password <span class="optional">(at least 8 characters)</span>
      <input type="password" name="password" required minlength="8">
    </label>
    <label>
      Confirm password
      <input type="password" name="confirm_password" required minlength="8">
    </label>
    <button type="submit" class="primary">Create account</button>
  </form>
  <p class="hint">Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
